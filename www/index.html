<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Talking Woman</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b1722; font-family:system-ui,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #status { position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:50%; transform:translateX(-50%); padding:6px 16px; border-radius:20px; background:#000a; color:#fff; font-size:14px; z-index:5; white-space:nowrap; }
  #mic { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 22px); left:50%; transform:translateX(-50%); width:64px; height:64px; border:0; border-radius:50%; font-size:28px; background:#fff; box-shadow:0 3px 10px #0006; z-index:5; }
  #mic.on { background:#ff8aa5; }
  #credit { position:fixed; bottom:4px; right:8px; font-size:9px; color:#fff6; z-index:5; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<div id="status">লোড হচ্ছে…</div>
<button id="mic">🎤</button>
<div id="credit">Avatar: Ready Player Me, CC BY-NC 4.0</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const setStatus = t => statusEl.textContent = t;

/* ---------- 3D scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2336);
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x554466, 1.1));
const key = new THREE.DirectionalLight(0xfff0e0, 2.2); key.position.set(1.2, 2.2, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb4ff, 1.0); rim.position.set(-2, 1.8, -1.5); scene.add(rim);

let head, neck, spine, morphMeshes = [], baseHead = new THREE.Euler(), baseNeck = new THREE.Euler();
let headPos = new THREE.Vector3();

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w/h;
  const dist = (w/h < 0.8) ? 1.15 : 0.95;
  camera.position.set(headPos.x, headPos.y + 0.02, headPos.z + dist);
  camera.lookAt(headPos.x, headPos.y - 0.13, headPos.z);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

new GLTFLoader().load('./models/woman.glb', gltf => {
  const model = gltf.scene; scene.add(model);
  model.traverse(o => {
    if (o.name === 'Wolf3D_Glasses') o.visible = false;
    if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o);
  });
  head = model.getObjectByName('Head'); neck = model.getObjectByName('Neck');
  if (head) baseHead.copy(head.rotation); if (neck) baseNeck.copy(neck.rotation);
  model.updateMatrixWorld(true);
  if (head) head.getWorldPosition(headPos);
  resize(); setStatus('মাইক চালু হচ্ছে…'); autoStart();
}, undefined, () => setStatus('মডেল লোড হয়নি, ইন্টারনেট চেক করুন'));

function morph(name, v){
  for (const m of morphMeshes){ const i = m.morphTargetDictionary[name]; if (i !== undefined) m.morphTargetInfluences[i] = v; }
}
const cur = {}; // smoothed values
function setSmooth(name, target, k=0.35){ cur[name] = (cur[name] ?? 0) + (target - (cur[name] ?? 0)) * k; morph(name, cur[name]); }

/* ---------- animation ---------- */
let mouth = 0, speaking = false, nextBlink = 2, blinkT = -1, visemeIdx = 0, visemeT = 0, nudge = 0;
const visemes = ['viseme_O','viseme_E','viseme_U','viseme_I','viseme_aa'];
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (head) {
    head.rotation.y = baseHead.y + Math.sin(t*0.6)*0.05 + (speaking ? Math.sin(t*3.1)*0.04 : 0);
    head.rotation.x = baseHead.x + Math.sin(t*0.9)*0.02 + (speaking ? mouth*0.05 : 0) + nudge;
    head.rotation.z = baseHead.z + Math.sin(t*0.45)*0.015;
    nudge *= 0.92;
  }
  // mouth from live output amplitude
  let amp = 0;
  if (speaking && outAnalyser){
    const a = new Uint8Array(outAnalyser.fftSize); outAnalyser.getByteTimeDomainData(a);
    let s = 0; for (const v of a){ const x=(v-128)/128; s += x*x; } amp = Math.min(1, Math.sqrt(s/a.length) * 5);
  }
  mouth += (amp - mouth) * 0.45;
  visemeT -= dt; if (visemeT <= 0){ visemeIdx = Math.floor(Math.random()*visemes.length); visemeT = 0.09 + Math.random()*0.1; }
  setSmooth('jawOpen', mouth*0.55);
  setSmooth('mouthOpen', mouth*0.25);
  for (const v of visemes) setSmooth(v, speaking && v === visemes[visemeIdx] ? mouth*0.7 : 0, 0.4);
  setSmooth('mouthSmile', speaking ? 0.18 : 0.12 + (listening ? 0.1 : 0), 0.1);
  setSmooth('browInnerUp', listening && !speaking ? 0.25 : 0.08, 0.08);
  // blinking
  nextBlink -= dt;
  if (nextBlink <= 0 && blinkT < 0){ blinkT = 0; nextBlink = 2 + Math.random()*3.5; }
  let blink = 0; if (blinkT >= 0){ blinkT += dt; blink = Math.sin(Math.min(1, blinkT/0.16) * Math.PI); if (blinkT > 0.16) blinkT = -1; }
  morph('eyeBlinkLeft', blink); morph('eyeBlinkRight', blink);
  renderer.render(scene, camera);
});
renderer.domElement.addEventListener('pointerdown', () => { nudge = -0.08; if (ctx && ctx.state==='suspended') ctx.resume(); autoStart(); });

/* ---------- voice: listen -> repeat in a higher, feminine voice ---------- */
let ctx, stream, analyser, outAnalyser, rec, chunks = [], recording = false, listening = false, busy = false, lastLoud = 0, startedAt = 0, manualStop = false;
const PITCH = 1.3;

async function startListening(){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024; src.connect(analyser);
    outAnalyser = ctx.createAnalyser(); outAnalyser.fftSize = 512; outAnalyser.connect(ctx.destination);
    listening = true; $('mic').classList.add('on'); setStatus('আমি শুনছি… কিছু বলুন 🙂');
    loop();
  }catch(e){ setStatus('মাইকের অনুমতি দিন, তারপর স্ক্রিনে একবার ট্যাপ করুন'); }
}
function stopListening(){
  listening = false; $('mic').classList.remove('on');
  if (stream) stream.getTracks().forEach(t=>t.stop());
  setStatus('মাইক বন্ধ (🎤 চাপলে আবার চালু)');
}
function level(){
  const a = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(a);
  let s=0; for (const v of a){ const x=(v-128)/128; s+=x*x; } return Math.sqrt(s/a.length);
}
function loop(){
  if (!listening) return;
  if (!busy){
    const l = level(), now = performance.now();
    if (l > 0.04){ lastLoud = now; if (!recording) beginRec(); }
    else if (recording && now - lastLoud > 800) endRec();
    if (recording && now - startedAt > 10000) endRec();
  }
  requestAnimationFrame(loop);
}
function beginRec(){
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = onRecDone; rec.start(); recording = true; startedAt = performance.now();
}
function endRec(){ recording = false; if (rec && rec.state !== 'inactive') rec.stop(); }
async function onRecDone(){
  if (performance.now() - startedAt < 500) return;
  busy = true;
  try{
    const buf = await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer());
    const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = PITCH;
    s.connect(outAnalyser);
    speaking = true; setStatus('💬');
    s.onended = () => { speaking = false; busy = false; setStatus('আমি শুনছি… কিছু বলুন 🙂'); };
    s.start();
  }catch(e){ busy = false; }
}
async function autoStart(){ if (!listening && !manualStop) await startListening(); }
$('mic').onclick = () => { if (listening){ manualStop = true; stopListening(); } else { manualStop = false; startListening(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden){ if (ctx) ctx.resume(); if (!listening) autoStart(); } });
setInterval(() => { if (listening && stream && !stream.active){ listening = false; autoStart(); } }, 3000);
</script>
</body>
</html>
